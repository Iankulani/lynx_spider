# ============================================
# LYNX-SPIDER-V1 - Kubernetes Secrets
# ⚠️ DO NOT COMMIT WITH REAL VALUES ⚠️
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: lynx-spider-secrets
  namespace: lynx-spider
  labels:
    app: lynx-spider
type: Opaque
stringData:
  # Bot Tokens
  DISCORD_TOKEN: ""
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  SLACK_BOT_TOKEN: ""
  SLACK_APP_TOKEN: ""
  
  # SMTP
  SMTP_SERVER: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  
  # Web
  WEB_SECRET_KEY: ""
  WEB_USERNAME: "admin"
  WEB_PASSWORD: ""
  
  # Database
  POSTGRES_USER: "lynx"
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: "lynx_spider"
  REDIS_PASSWORD: ""
  
  # Grafana
  GRAFANA_USER: "admin"
  GRAFANA_PASSWORD: ""
  
  # Encryption
  FERNET_KEY: ""
