# ============================================
# LYNX-SPIDER-V1 - Secrets Configuration
# ⚠️ WARNING: DO NOT COMMIT THIS FILE ⚠️
# This file contains sensitive credentials
# Use environment variables or a secrets manager
# ============================================

version: '1.0'

# ============ PLATFORM BOT TOKENS ============
bots:
  # Discord Bot Configuration
  discord:
    enabled: false
    token: "YOUR_DISCORD_BOT_TOKEN_HERE"
    channel_id: "YOUR_CHANNEL_ID_HERE"
    guild_id: "YOUR_GUILD_ID_HERE"
    prefix: "!"
    admin_role: "Admin"
    webhook_url: ""

  # Telegram Bot Configuration
  telegram:
    enabled: false
    bot_token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
    chat_id: "YOUR_CHAT_ID_HERE"
    api_id: "YOUR_API_ID"
    api_hash: "YOUR_API_HASH"
    prefix: "/"
    channel_id: ""

  # Slack Bot Configuration
  slack:
    enabled: false
    bot_token: "xoxb-YOUR_SLACK_BOT_TOKEN"
    app_token: "xapp-YOUR_SLACK_APP_TOKEN"
    channel_id: "YOUR_CHANNEL_ID"
    signing_secret: "YOUR_SIGNING_SECRET"
    prefix: "!"

  # WhatsApp Configuration
  whatsapp:
    enabled: false
    phone_number: "+1234567890"
    api_key: "YOUR_WHATSAPP_API_KEY"
    prefix: "!"

  # Signal Configuration
  signal:
    enabled: false
    phone_number: "+1234567890"
    group_id: "YOUR_GROUP_ID"
    signal_cli_path: "/usr/local/bin/signal-cli"
    prefix: "!"

  # Google Chat Configuration
  google_chat:
    enabled: false
    webhook_url: "https://chat.googleapis.com/v1/spaces/YOUR_SPACE/messages?key=YOUR_KEY&token=YOUR_TOKEN"
    space_id: "YOUR_SPACE_ID"
    credentials_file: "/app/config/google-credentials.json"
    prefix: "/"

  # iMessage Configuration (macOS only)
  imessage:
    enabled: false
    phone_numbers:
      - "+1234567890"
    prefix: "!"

# ============ EMAIL/SMTP CONFIGURATION ============
smtp:
  server: "smtp.gmail.com"
  port: 587
  username: "your-email@gmail.com"
  password: "your-app-password"
  use_tls: true
  use_ssl: false
  from_name: "Security Team"
  from_email: "your-email@gmail.com"

# ============ DATABASE CREDENTIALS ============
database:
  sqlite:
    path: "/app/.lynx_spider/lynx_spider.db"
  
  postgresql:
    enabled: false
    host: "postgres"
    port: 5432
    database: "lynx_spider"
    username: "lynx"
    password: "CHANGE_ME_STRONG_PASSWORD"
  
  redis:
    enabled: false
    host: "redis"
    port: 6379
    password: "CHANGE_ME_REDIS_PASSWORD"
    db: 0

# ============ WEB DASHBOARD ============
web:
  secret_key: "GENERATE_RANDOM_SECRET_KEY_HERE"
  username: "admin"
  password: "CHANGE_ME_STRONG_PASSWORD"
  session_timeout: 86400
  enable_registration: false

# ============ API KEYS ============
api_keys:
  # IP Geolocation
  ipapi:
    key: "YOUR_IPAPI_KEY"
  
  # VirusTotal
  virustotal:
    key: "YOUR_VIRUSTOTAL_API_KEY"
  
  # Shodan
  shodan:
    key: "YOUR_SHODAN_API_KEY"
  
  # Censys
  censys:
    api_id: "YOUR_CENSYS_API_ID"
    api_secret: "YOUR_CENSYS_API_SECRET"
  
  # Have I Been Pwned
  hibp:
    key: "YOUR_HIBP_API_KEY"
  
  # AbuseIPDB
  abuseipdb:
    key: "YOUR_ABUSEIPDB_API_KEY"
  
  # AlienVault OTX
  alienvault:
    key: "YOUR_ALIENVAULT_OTX_KEY"

# ============ MONITORING ============
monitoring:
  prometheus:
    enabled: true
    port: 9090
  
  grafana:
    enabled: true
    admin_user: "admin"
    admin_password: "CHANGE_ME_GRAFANA_PASSWORD"
    port: 3000

# ============ ENCRYPTION ============
encryption:
  # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  fernet_key: "YOUR_FERNET_KEY_HERE"
  
  # SSH Keys
  ssh_key_path: "/app/.lynx_spider/ssh_keys/id_rsa"
  
  # TLS Certificates
  tls_cert: "/app/config/certs/server.crt"
  tls_key: "/app/config/certs/server.key"
  ca_cert: "/app/config/certs/ca.crt"

# ============ CLOUD PROVIDERS ============
cloud:
  aws:
    access_key_id: "YOUR_AWS_ACCESS_KEY"
    secret_access_key: "YOUR_AWS_SECRET_KEY"
    region: "us-east-1"
  
  azure:
    tenant_id: "YOUR_AZURE_TENANT_ID"
    client_id: "YOUR_AZURE_CLIENT_ID"
    client_secret: "YOUR_AZURE_CLIENT_SECRET"
    subscription_id: "YOUR_AZURE_SUBSCRIPTION_ID"
  
  gcp:
    project_id: "YOUR_GCP_PROJECT_ID"
    credentials_file: "/app/config/gcp-credentials.json"

# ============ NOTIFICATION SERVICES ============
notifications:
  # Pushover
  pushover:
    enabled: false
    token: "YOUR_PUSHOVER_TOKEN"
    user_key: "YOUR_PUSHOVER_USER_KEY"
  
  # Twilio (SMS)
  twilio:
    enabled: false
    account_sid: "YOUR_TWILIO_ACCOUNT_SID"
    auth_token: "YOUR_TWILIO_AUTH_TOKEN"
    from_number: "+1234567890"
  
  # SendGrid
  sendgrid:
    enabled: false
    api_key: "YOUR_SENDGRID_API_KEY"

# ============ THREAT INTELLIGENCE ============
threat_intel:
  # MISP
  misp:
    enabled: false
    url: "https://misp.example.com"
    api_key: "YOUR_MISP_API_KEY"
  
  # OpenCTI
  opencti:
    enabled: false
    url: "https://opencti.example.com"
    api_key: "YOUR_OPENCTI_API_KEY"
  
  # TheHive
  thehive:
    enabled: false
    url: "https://thehive.example.com"
    api_key: "YOUR_THEHIVE_API_KEY"

# ============ LICENSE ============
license:
  key: "YOUR_LICENSE_KEY"
  type: "enterprise"
  expires: "2025-12-31"
