# ============================================
# LYNX-SPIDER-V1 - Grafana Configuration
# ============================================

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = localhost
enforce_domain = false
root_url = http://localhost:3000
serve_from_sub_path = false

[database]
type = sqlite3
path = grafana.db
# For PostgreSQL:
# type = postgres
# host = postgres:5432
# name = grafana
# user = grafana
# password = grafana_password
# ssl_mode = disable

[session]
provider = file
provider_config = sessions

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
admin_user = admin
admin_password = lynx_spider_2024
secret_key = CHANGE_ME_RANDOM_SECRET
disable_gravatar = true
cookie_secure = false
cookie_samesite = lax
allow_embedding = true

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false
org_name = Main Org.
org_role = Viewer

[auth.basic]
enabled = true

[log]
mode = console file
level = info
format = text

[log.console]
level = info
format = text

[log.file]
level = info
format = text
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

[metrics]
enabled = true
interval_seconds = 10
disable_total_stats = false

[metrics.basic_auth]
enabled = false

[snapshots]
external_enabled = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/lynx-spider.json

[plugins]
enable_alpha = false
allow_loading_unsigned_plugins = grafana-piechart-panel,grafana-worldmap-panel

[feature_toggles]
enable = dashboardNewLayouts
